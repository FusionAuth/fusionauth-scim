---
name: build

on:
  - push

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: /usr/bin/bash -l -e -o pipefail {0}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          # gitversion computes the version from tags
          fetch-depth: 0
      # Installs Java and Gradle from mise.toml. No CodeArtifact URL is set, so dependencies come from Maven Central.
      - name: setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.11.7
      - name: build and test
        run: |
          gradle --version
          gradle build
      - name: publish markdown test report
        if: success() || failure() # always run even if the previous step fails
        run: |
          # Only produced when the build uses CodeArtifact (see build.gradle)
          if [ -f build/reports/tests/test/test_report.md ]; then
            cat build/reports/tests/test/test_report.md >> $GITHUB_STEP_SUMMARY
          fi
      - name: capture reports
        uses: actions/upload-artifact@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          name: test_reports
          path: build/reports/tests/
